# CI: pure tests + Unity EditMode/PlayMode tests on pushes to main and on PRs. Pushes to main NEVER build an APK.
# Android builds (signed APK on a GitHub Release; GitHub only, nothing goes to any store) run only for version tags:
#   v1.2.0            → release      (marked "Latest")
#   v1.2.0-beta.1     → pre-release  (also -alpha.N / -rc.N; not marked "Latest")
# The tag must equal VERSION.txt with a "v" prefix. Secrets: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD,
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEYALIAS_NAME, ANDROID_KEYALIAS_PASS (see BUILD.md).
name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  pull_request:

jobs:
  pure-tests:
    name: Pure C# tests + content validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Tests with coverage
        run: dotnet test DotnetTests/GameTests --collect:"XPlat Code Coverage" --results-directory TestResults/dotnet
      - name: Validate content CSVs and run progression simulator
        run: |
          dotnet run -c Release --project DotnetTests/BalanceCli -- validate
          dotnet run -c Release --project DotnetTests/BalanceCli -- progression 1,2,3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults/dotnet

  unity-tests:
    name: Unity EditMode + PlayMode
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: all
          artifactsPath: TestResults/unity
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: TestResults/unity

  android-release:
    name: Android ${{ contains(github.ref_name, '-') && 'pre-release' || 'release' }} (APK → GitHub Release)
    runs-on: ubuntu-latest
    needs: [pure-tests, unity-tests]
    # Version tags only: a push to main never reaches this job.
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Tag must be vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N and match VERSION.txt
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a release (v1.2.0) or pre-release (v1.2.0-beta.1) tag."
            exit 1
          fi
          want="$(tr -d '[:space:]' < VERSION.txt)"
          if [[ "${GITHUB_REF_NAME#v}" != "$want" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION.txt ($want). Bump VERSION.txt, commit, then tag v$want."
            exit 1
          fi
      # Cache LFS objects so each release does not re-download every asset (LFS bandwidth quota).
      - name: List LFS objects
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - run: git lfs pull
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-
      # Signed APK for sideloading from the GitHub Release (no AAB: nothing is uploaded to a store).
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: Game.EditorTools.BuildScript.BuildAndroidReleaseApk
          versioning: None
          androidKeystoreName: squadfight-upload.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            Builds/Android/*.apk
            Builds/size-report.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SquadFight ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            Builds/Android/*.apk
