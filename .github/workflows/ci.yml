# CI: pure tests + Unity EditMode/PlayMode tests on pushes to main and on PRs (Unity tests need the UNITY_LICENSE,
# UNITY_EMAIL, UNITY_PASSWORD secrets). CI never builds Android or iOS and never publishes a release: APKs are built
# on the owner's Mac (tools/build-apk.sh) and uploaded to GitHub Releases by hand. See BUILD.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI cannot create releases (checks: write only lets the Unity test runner report results).
permissions:
  contents: read
  checks: write

jobs:
  pure-tests:
    name: Pure C# tests + content validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Tests with coverage
        run: dotnet test DotnetTests/GameTests --collect:"XPlat Code Coverage" --results-directory TestResults/dotnet
      - name: Validate content CSVs and run progression simulator
        run: |
          dotnet run -c Release --project DotnetTests/BalanceCli -- validate
          dotnet run -c Release --project DotnetTests/BalanceCli -- progression 1,2,3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults/dotnet

  unity-tests:
    name: Unity EditMode + PlayMode
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: all
          artifactsPath: TestResults/unity
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: TestResults/unity
